# The workflow actions are pinned to commit SHAs so a republished tag cannot
# change what runs in the workflow that holds the signing secrets. Dependabot
# is what keeps those pins moving: it proposes the new SHA with a diff to
# review, instead of the pin silently going stale. It also covers the actions
# advisory gap - action fixes often ship without a published advisory, so
# security-only updates would miss them. SHA pins get no advisory alerts at
# all, so this schedule is the only thing that moves them, fixes included: a
# pin can sit up to a month behind a fix unless someone bumps it by hand.
# Monthly and grouped into one PR is the accepted trade for about a dozen
# reviews a year instead of one per action release.
#
# npm is deliberately absent: version updates there are churn with little
# security value for this repo, and each update is itself supply-chain
# exposure. Advisory-driven security PRs still arrive without any config.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
