# The workflow actions are pinned to commit SHAs so a republished tag cannot
# change what runs in the workflow that holds the signing secrets. Dependabot
# is what keeps those pins moving: it proposes the new SHA with a diff to
# review, instead of the pin silently going stale.
#
# The npm cooldown holds new releases back for a week before proposing them,
# so a poisoned release published hours before an update lands here doesn't
# get pulled in - most registry compromises are caught within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
